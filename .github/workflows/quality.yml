name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - trunk-merge/** # yamllint disable-line rule:quoted-strings
      - trunk-temp/** # yamllint disable-line rule:quoted-strings
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  verify:
    name: Tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

  trunk:
    name: Trunk Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run all configured linters
        uses: trunk-io/trunk-action@v1
        with:
          arguments: --no-fix
          check-mode: all
